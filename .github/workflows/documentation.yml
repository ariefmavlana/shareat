name: Documentation validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install image metadata reader
        run: python -m pip install Pillow
      - name: Validate documentation and reference inventory
        run: python docs/tools/validate_docs.py
      - name: Check whitespace and reproducible generated files
        run: |
          git diff --check
          git diff --exit-code -- docs/ASSET_INVENTORY.csv docs/LEGACY_MISSING_REFERENCES.csv docs/VALIDATION.md
