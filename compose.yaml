name: shareat-r1-dev
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: shareat
      POSTGRES_USER: shareat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:33068:5432"
    volumes:
      - shareat_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareat -d shareat"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  shareat_postgres:
